
name: movierec

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: movierec-api:local
    container_name: movierec-api

    ports:
      - "8000:8000"

    restart: unless-stopped
    init: true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
